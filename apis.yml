name: Axamer
description: >-
  Axamer is the company behind Menteo (menteo.ai), an AI-agent platform for restaurants and
  restaurant chains, focused on Latin America. Menteo deploys a team of specialized AI agents
  for marketing (WhatsApp and email campaigns), 24/7 WhatsApp order taking, loyalty and rewards
  programs, and customer service, integrating with existing POS systems, delivery platforms, and
  messaging channels to unify customer data and automate marketing, sales, and retention. Plans
  start from $149 USD/month with no long-term contract. Surfaced as a portfolio company of
  500 Global and added to the API Evangelist network; as of this pass Menteo publishes a public
  marketing site with Terms of Service and Privacy Policy but no public developer portal, API
  reference, OpenAPI, or /.well-known discovery surface.
